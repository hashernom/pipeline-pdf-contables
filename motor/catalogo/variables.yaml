    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Seleccione 'si' cuando el acuerdo municipal disponga que la generación de energía eléctrica continúa gravada por el ICA conforme al artículo 7 de la Ley 56 de 1981; en caso contrario, o si el texto no regula este supuesto, seleccione 'no' o 'no_aplica' según corresponda.
