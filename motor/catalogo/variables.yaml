    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' únicamente si el acuerdo municipal establece expresamente una base gravable especial para los ingresos por arrendamientos; en caso contrario, marque 'no' si la norma no contempla dicha base especial para arrendamientos, y 'no_aplica' si el texto no regula la materia o no permite determinarlo.
    critica: null
    metodo: null
