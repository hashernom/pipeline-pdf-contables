version: borrador-1
fuente: Matriz ICA Distribución Curación_verificacion.xlsx
bloques:
- key: elementos_del_tributo.sujeto_activo
  nombre: Sujeto activo
  hoja: Elementos del tributo
  columnas:
    art: G
    pag: H
    cita: I
    presencia: J
  palabras_clave:
  - sujeto
  - activo
  - devolucion
  - discusion
  - potestades
  - radican
  - cause
  - genere
  - investigacion
  - actuaciones
  - administrativo
  - necesarias
  presencia_key: elementos_del_tributo.sujeto_activo.presencia_ausencia
  criterio_presencia: Se asigna 'si' cuando el acuerdo municipal identifica expresamente al municipio o distrito como sujeto activo del impuesto de industria y comercio dentro de su jurisdicción, o le atribuye las potestades tributarias de administración, control, fiscalización, determinación, discusión, liquidación, cobro, recaudo, devolución e imposición de sanciones. Si el texto no menciona ni atribuye dicha titularidad o potestades al ente territorial, se asigna 'no'.
  campos: []
- key: elementos_del_tributo.sujeto_pasivos
  nombre: Sujeto Pasivos
  hoja: Elementos del tributo
  columnas:
    art: L
    pag: M
    cita: N
    presencia: O
  palabras_clave:
  - sujeto
  - pasivos
  - consorcios
  - uniones
  - consistente
  - mixta
  - beneficiarios
  - fideicomitentes
  - gestor
  - socio
  - departamental
  - consorciados
  presencia_key: elementos_del_tributo.sujeto_pasivos.presencia_ausencia
  criterio_presencia: Marque 'si' cuando el acuerdo municipal defina o describa expresamente quiénes son los sujetos pasivos del tributo (personas naturales, jurídicas, sociedades de hecho, consorcios, uniones temporales, patrimonios autónomos, etc.) indicando que son quienes realizan el hecho generador. Marque 'no' si el texto no contiene dicha definición y 'no_aplica' si el acuerdo no regula la materia del tributo correspondiente.
  campos:
  - key: elementos_del_tributo.sujeto_pasivos.persona_natural
    nombre: Persona Natural
    columna: P
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal incluya expresamente a las personas naturales dentro de la definición de sujetos pasivos del tributo, ya sea de forma individual o junto con otras categorías de sujetos. Si el texto no las menciona como sujetos pasivos, evalúe 'no' o 'no_aplica' según corresponda.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.persona_juridica
    nombre: Persona Jurídica
    columna: Q
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal incluya expresamente a las personas jurídicas (sociedades, empresas unipersonales, entidades públicas o privadas, consorcios, uniones temporales, patrimonios autónomos, etc.) dentro de la definición de sujetos pasivos del tributo; marque 'no' si la norma excluye o no contempla a las personas jurídicas como sujetos pasivos, y 'no_aplica' si el texto no regula la determinación de sujetos pasivos.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.sociedad_de_hecho
    nombre: Sociedad de Hecho
    columna: R
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Seleccione 'si' cuando el acuerdo municipal incluya expresamente a las sociedades de hecho dentro de la enumeración de sujetos pasivos del impuesto; seleccione 'no' cuando el texto no las mencione o las excluya de dicha enumeración.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.comunidades_organizadas
    nombre: Comunidades Organizadas
    columna: S
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' si el acuerdo municipal incluye expresamente a las comunidades organizadas como sujetos pasivos del impuesto; marque 'no' si la enumeración de sujetos pasivos no las menciona y se limita a personas naturales, jurídicas, sociedades de hecho, consorcios, uniones temporales o patrimonios autónomos; use 'no_aplica' si el texto no regula sujetos pasivos.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.sucesiones_iliquidas
    nombre: Sucesiones Ilíquidas
    columna: T
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' si el acuerdo municipal incluye expresamente a las sucesiones ilíquidas dentro de la enumeración de sujetos pasivos del impuesto; marque 'no' si la lista de sujetos pasivos omite mencionarlas, y 'no_aplica' si el texto no regula la materia de sujetos pasivos.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.consorcios
    nombre: Consorcios
    columna: U
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Selecciona 'si' cuando el acuerdo municipal mencione expresamente a los consorcios (junto con uniones temporales o patrimonios autónomos) como sujetos pasivos del impuesto; selecciona 'no' cuando la definición de sujeto pasivo no los incluya y 'no_aplica' cuando el texto no regule la materia de sujetos pasivos.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.empresas_unipersonales
    nombre: Empresas Unipersonales
    columna: V
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' si el acuerdo municipal incluye expresamente a las empresas unipersonales dentro de la enumeración de sujetos pasivos del impuesto; marque 'no' si la lista de sujetos pasivos no las menciona, y 'no_aplica' si el texto no regula la determinación de sujetos pasivos.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.uniones_temporales
    nombre: Uniones Temporales
    columna: W
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal incluya expresamente a las uniones temporales dentro de la enumeración de sujetos pasivos del impuesto, y marque 'no' cuando la norma no las mencione o solo se refiera a personas naturales, jurídicas, sociedades de hecho y patrimonios autónomos sin incluirlas.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.patrimonios_autonomos
    nombre: Patrimonios Autónomos
    columna: X
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal incluya expresamente a los patrimonios autónomos dentro de la enumeración de sujetos pasivos del impuesto; marque 'no' cuando la norma defina los sujetos pasivos sin mencionarlos o los excluya, y use 'no_aplica' si el texto no regula la materia de sujetos pasivos.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.fiducias
    nombre: Fiducias
    columna: Y
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' únicamente si el acuerdo municipal menciona expresamente a las fiducias o a los patrimonios autónomos derivados de contratos de fiducia como sujetos pasivos del impuesto; en caso contrario, marque 'no'. Si el texto no regula la materia de sujetos pasivos o no permite determinar la inclusión de las fiducias, marque 'no_aplica'.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.cuentas_de_participacion
    nombre: Cuentas de Participación
    columna: Z
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal incluya expresamente las cuentas de participación (o figuras contractuales asimiladas) dentro de la enumeración de sujetos pasivos del impuesto; marque 'no' cuando la norma solo mencione consorcios, uniones temporales y patrimonios autónomos sin referirse a cuentas de participación; y use 'no_aplica' si el texto no regula la determinación de sujetos pasivos.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.entidades_sin_animo_de_lucro
    nombre: Entidades Sin Ánimo de Lucro
    columna: AA
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Seleccione 'si' si el acuerdo municipal incluye expresamente a las entidades sin ánimo de lucro dentro de la definición de sujetos pasivos del impuesto; seleccione 'no' si la definición de sujetos pasivos solo menciona personas naturales, jurídicas, sociedades de hecho, consorcios, uniones temporales, patrimonios autónomos u otras entidades sin referirse a las entidades sin ánimo de lucro; y seleccione 'no_aplica' si el texto no aborda la determinación de sujetos pasivos.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.propiedad_horizontal
    nombre: Propiedad Horizontal
    columna: AB
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal incluya expresamente a la propiedad horizontal (o a las personas jurídicas que la conforman) dentro de la enumeración de sujetos pasivos del impuesto; marque 'no' cuando la lista de sujetos pasivos no la mencione y se limite a personas naturales, jurídicas, sociedades de hecho, consorcios, uniones temporales y patrimonios autónomos; use 'no_aplica' si el texto no regula sujetos pasivos.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.establecimientos_publicos
    nombre: Establecimientos Públicos
    columna: AC
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal incluya expresamente a los establecimientos públicos dentro de la enumeración de sujetos pasivos del impuesto; marque 'no' cuando la norma solo mencione personas naturales, jurídicas, sociedades de hecho, consorcios, uniones temporales o patrimonios autónomos sin referirse a los establecimientos públicos, y use 'no_aplica' si el texto no regula la materia de sujetos pasivos.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.empresas_industriales_y_comerciales_del_estado
    nombre: "Empresas Industriales y\n Comerciales del Estado"
    columna: AD
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: 'Se asigna ''si'' cuando el acuerdo municipal incluye expresamente a las Empresas Industriales y Comerciales del Estado (de cualquier orden: nacional, departamental o municipal) dentro de la enumeración de sujetos pasivos del impuesto; se asigna ''no'' cuando la norma no las menciona o solo alude a entidades públicas o privadas en términos genéricos sin referirlas de manera expresa.'
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.sociedades_de_economia_mixta
    nombre: Sociedades de Economía Mixta
    columna: AE
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' si el acuerdo municipal menciona expresamente a las sociedades de economía mixta como sujetos pasivos del impuesto; marque 'no' si la enumeración de sujetos pasivos no las incluye o solo se refiere a otras entidades; use 'no_aplica' si el texto no regula sujetos pasivos.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.unidades_administrativas_con_regimen_especial
    nombre: "Unidades Administrativas \ncon Régimen Especial"
    columna: AF
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Selecciona 'si' únicamente si el acuerdo municipal menciona de forma expresa que ciertas unidades administrativas (por ejemplo, establecimientos públicos, empresas industriales y comerciales del Estado o entidades descentralizadas) están sujetas a un régimen tributario especial como sujetos pasivos del ICA; en caso contrario, selecciona 'no' cuando la definición de sujeto pasivo no contemple dicho régimen especial, y 'no_aplica' si el texto no aborda el tema de sujetos pasivos.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.departamento
    nombre: Departamento
    columna: AG
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal defina expresamente como sujeto pasivo del impuesto a las entidades del orden departamental (o incluya entidades públicas departamentales entre los sujetos pasivos); marque 'no' cuando la definición de sujeto pasivo se limite a personas naturales, jurídicas, sociedades de hecho, consorcios, uniones temporales y patrimonios autónomos sin mencionar entidades departamentales, y 'no_aplica' si el texto no regula sujetos pasivos.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.nacion
    nombre: Nación
    columna: AH
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal incluya expresamente a las entidades públicas del orden nacional (como empresas industriales y comerciales del Estado nacionales) dentro de la enumeración de sujetos pasivos del impuesto; marque 'no' cuando la definición de sujetos pasivos se limite a personas naturales, jurídicas, sociedades de hecho, consorcios, uniones temporales o patrimonios autónomos sin mencionar entidades del orden nacional, y 'no_aplica' si el texto no aborda la determinación de sujetos pasivos.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.otros
    nombre: Otros
    columna: AI
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal incluya como sujetos pasivos del impuesto a otros sujetos distintos de los enumerados en los demás campos del bloque; marque 'no' si no hay otros.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.sujeto_pasivos.cuales
    nombre: ¿Cuáles?
    columna: AJ
    tipo: texto_libre
    unidad: null
    valores_permitidos: null
    criterio: Identifique en el texto del acuerdo municipal las personas naturales o jurídicas, o las actividades económicas, señaladas expresamente como sujetos pasivos del impuesto; si la norma remite a una definición general, transcriba o resuma esa descripción tal como aparece en el articulado.
    critica: null
    metodo: null
    estado: borrador
- key: elementos_del_tributo.hecho_generador
  nombre: Hecho Generador
  hoja: Elementos del tributo
  columnas:
    art: AL
    pag: AM
    cita: AN
    presencia: AO
  palabras_clave:
  - hecho
  - generador
  - indirecta
  - inmueble
  - genera
  - nacimiento
  - origina
  - equipamiento
  - presupuesto
  - tipificar
  - constituido
  - directa
  presencia_key: elementos_del_tributo.hecho_generador.presencia_ausencia
  criterio_presencia: Se asigna 'si' cuando el acuerdo municipal define o describe expresamente el hecho generador del impuesto (presupuesto o causa que origina la obligación tributaria, o la realización de actividades industriales, comerciales o de servicios en la jurisdicción). Se asigna 'no' cuando el texto no contiene dicha definición ni descripción del hecho generador, y 'no_aplica' cuando el campo no resulta pertinente para el bloque analizado.
  campos:
  - key: elementos_del_tributo.hecho_generador.realizacion_directa
    nombre: Realización Directa
    columna: AP
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el texto del acuerdo describa la realización efectiva de actividades industriales, comerciales, de servicios o financieras en la jurisdicción del municipio, ya sea de forma directa o indirecta, permanente u ocasional, con o sin establecimiento de comercio. Marque 'no' cuando la cita se limite a definir el hecho generador en abstracto como presupuesto jurídico del tributo, sin referirse a la realización concreta de dichas actividades.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.hecho_generador.realizacion_indirecta
    nombre: Realización Indirecta
    columna: AQ
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el texto del acuerdo establezca expresamente que el hecho generador del impuesto se realiza de forma directa o indirecta; marque 'no' cuando la definición del hecho generador no contemple la realización indirecta, y 'no_aplica' si el acuerdo no regula el hecho generador del ICA.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.hecho_generador.de_forma_permanente
    nombre: De Forma Permanente
    columna: AR
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Se asigna 'si' cuando el texto del acuerdo menciona expresamente que las actividades gravadas pueden realizarse de forma permanente u ocasional (o solo permanente) como parte de la descripción del hecho generador; se asigna 'no' cuando la norma se limita a definir el hecho generador de manera genérica sin referirse a la permanencia de la actividad, y 'no_aplica' si el apartado no aborda el hecho generador.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.hecho_generador.de_forma_ocasional
    nombre: De Forma Ocasional
    columna: AS
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el texto del acuerdo incluya expresamente la realización ocasional de las actividades gravadas dentro de la descripción del hecho generador (por ejemplo, 'en forma permanente u ocasional'); marque 'no' cuando el hecho generador se defina de manera general sin mencionar la forma ocasional; y use 'no_aplica' si el acuerdo no regula el hecho generador del ICA.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.hecho_generador.con_establecimiento
    nombre: Con Establecimiento
    columna: AT
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Asigne 'si' cuando el texto del acuerdo mencione expresamente que las actividades gravadas se realizan con establecimiento de comercio (o en inmuebles destinados como tal), y 'no' cuando el hecho generador se describa sin referencia a establecimientos de comercio o se limite a la definición genérica del presupuesto del tributo.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.hecho_generador.sin_establecimiento
    nombre: Sin Establecimiento
    columna: AU
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el texto del acuerdo mencione explícitamente que el hecho generador del impuesto se causa con o sin establecimiento de comercio (o expresiones equivalentes como 'con establecimientos de comercio o sin ellos'); marque 'no' cuando la definición del hecho generador no haga referencia alguna a la existencia o ausencia de establecimiento de comercio.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.hecho_generador.a_traves_del_uso_de_las_tic
    nombre: A través del uso de las TIC
    columna: AV
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el texto del acuerdo incluya explícitamente el uso de tecnologías de la información y la comunicación (TIC) como parte del hecho generador del impuesto de industria y comercio; en caso contrario, marque 'no'.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.hecho_generador.otros
    nombre: Otros
    columna: AW
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal describa el hecho generador con una modalidad distinta de las enumeradas en los demás campos del bloque; marque 'no' si no hay otras.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.hecho_generador.cuales
    nombre: ¿Cuáles?
    columna: AX
    tipo: texto_libre
    unidad: null
    valores_permitidos: null
    criterio: Identifique en el texto del acuerdo municipal el aparte que define el hecho generador del ICA; si se limita a señalar que es el presupuesto o causa que tipifica el tributo y origina la obligación tributaria, registre 'Presupuesto'; si el aparte describe las actividades gravadas sin definir el presupuesto, registre 'no_aplica'.
    critica: null
    metodo: null
    estado: borrador
- key: elementos_del_tributo.hecho_imponible
  nombre: Hecho Imponible
  hoja: Elementos del tributo
  columnas:
    art: AY
    pag: AZ
    cita: BA
    presencia: BB
  palabras_clave:
  - hecho
  - imponible
  - materia
  - recaera
  - obligatorio
  - santander
  - ejerzan
  - todas
  - cuanto
  - cumplan
  - caracter
