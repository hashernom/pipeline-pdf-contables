    - no_aplica
    criterio: El campo se marca 'si' cuando el acuerdo municipal establece expresamente que, en las actividades de transporte de gas combustible, el impuesto de industria y comercio se causa sobre los ingresos promedio obtenidos por esa actividad, siempre que la puerta de ciudad esté ubicada en jurisdicción del respectivo municipio o distrito; en caso contrario, se marca 'no'.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.causacion_de_los_servicios_publicos_domiciliarios_para_el_ica.energia_electrica_de_empresas_no_generadoras
    nombre: "Energía Eléctrica de Empresas \nNo Generadoras"
    columna: CG
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Selecciona 'si' cuando el acuerdo municipal establezca que la compraventa de energía eléctrica realizada por empresas no generadoras, cuyos destinatarios no sean usuarios finales, causa el ICA en el municipio del domicilio del vendedor sobre el valor promedio mensual facturado; selecciona 'no' si el texto no contempla esta regla específica para empresas no generadoras.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.causacion_de_los_servicios_publicos_domiciliarios_para_el_ica.otros
    nombre: ¿Otros?
    columna: CH
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal fije una regla de causación para servicios públicos domiciliarios distinta de las enumeradas en los demás campos del bloque; marque 'no' si no hay otra.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.causacion_de_los_servicios_publicos_domiciliarios_para_el_ica.cuales
    nombre: ¿Cuáles?
    columna: CI
    tipo: texto_libre
    unidad: null
    valores_permitidos: null
    criterio: Identificar y transcribir las reglas específicas de causación del ICA para servicios públicos domiciliarios señaladas en el acuerdo municipal (generación de energía, subestaciones de transmisión, transporte de gas, compraventa de energía, entre otras), indicando en qué supuestos y condiciones se causa el impuesto en la jurisdicción.
    critica: null
    metodo: null
    estado: borrador
- key: elementos_del_tributo.base_gravable
