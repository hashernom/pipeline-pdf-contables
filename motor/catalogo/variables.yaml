    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Seleccione 'si' si el acuerdo municipal establece una base gravable especial para las cooperativas de trabajo asociado, determinándola sobre los ingresos netos una vez descontadas las compensaciones entregadas a los trabajadores asociados cooperados o sobre la parte correspondiente al AIU; en caso contrario, seleccione 'no'.
