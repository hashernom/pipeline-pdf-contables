    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' si el acuerdo municipal establece una regla especial de base gravable que distribuya los ingresos del transporte terrestre entre la empresa y el propietario del vehículo; marque 'no' si el texto no contempla dicha distribución entre empresa y propietario; y 'no_aplica' si el acuerdo no regula el transporte terrestre ni bases gravables especiales.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.base_gravable_especial.impuesto_al_consumo
    nombre: Impuesto al Consumo
