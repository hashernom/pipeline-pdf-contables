    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' si el acuerdo municipal incluye expresamente a los patrimonios autónomos dentro de las reglas de base gravable especial del ICA; marque 'no' si la sección de bases gravables especiales no los menciona; y 'no_aplica' si el texto no regula bases gravables especiales.
    critica: null
    metodo: null
