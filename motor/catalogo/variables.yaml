    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal defina la base gravable del ICA remitiéndose o aplicando expresamente la Ley 1819 de 2016 (por ejemplo, al incorporar las reglas del artículo 28 del Estatuto Tributario Nacional para determinar los ingresos); marque 'no' cuando la base gravable se sustente únicamente en normas anteriores o distintas (Ley 14 de 1983, Decreto 1333 de 1986 u otras) sin referencia a dicha ley.
