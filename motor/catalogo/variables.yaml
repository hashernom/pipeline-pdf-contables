- key: elementos_del_tributo.base_presunta_minima
  nombre: Base Presunta Mínima
  hoja: Elementos del tributo
  columnas:
    art: DQ
    pag: DR
    cita: DS
    presencia: DT
  palabras_clave:
  - base
  - presunta
  - minima
  - dicha
  - contribuyente
  - impuesto
  presencia_key: elementos_del_tributo.base_presunta_minima.presencia_ausencia
  criterio_presencia: Marque 'si' cuando el acuerdo municipal establezca una base presunta mínima o impuesto mínimo a liquidar (por ejemplo, en UVT o en pesos) para los contribuyentes del ICA cuyas bases declaradas sean inferiores a un umbral determinado; en caso contrario, o si no se contempla dicha figura, marque 'no' o 'no_aplica' según corresponda.
  campos:
  - key: elementos_del_tributo.base_presunta_minima.valor_expresado_uvt
    nombre: Valor expresado UVT
    columna: DU
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal exprese la base presunta mínima del impuesto en unidades de UVT (por ejemplo, 2.0 UVT o 3.0 UVT) o remita a la UVT fijada por la DIAN para determinar dicho valor mínimo; en caso contrario, marque 'no' o 'no_aplica' según corresponda.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.base_presunta_minima.cuantas_uvt
    nombre: ¿Cuántas UVT?
    columna: DV
    tipo: numero
    unidad: null
    valores_permitidos: null
    criterio: Identifique en el texto del acuerdo municipal el número de UVT que se asigna como base presunta mínima o impuesto mínimo a liquidar, tomando el valor numérico expresado (por ejemplo, 1, 2 o 3 UVT) según el sector o la condición del contribuyente.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.base_presunta_minima.equivalente_en_pesos
    nombre: Equivalente en Pesos
    columna: DW
    tipo: numero
    unidad: null
    valores_permitidos: null
    criterio: Identificar en el texto del acuerdo municipal el número de UVT que corresponde a la base presunta mínima (tarifa mínima del impuesto) y multiplicarlo por el valor de la UVT establecido por la DIAN para la vigencia respectiva, registrando el resultado en pesos como equivalente numérico.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.base_presunta_minima.valor_expresado_smmlv
    nombre: Valor expresado SMMLV
    columna: DX
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'no' si la base presunta mínima o el impuesto mínimo se expresa en UVT (unidades de valor tributario) o en pesos, y marque 'si' únicamente cuando el acuerdo municipal exprese dicho valor en salarios mínimos mensuales legales vigentes (SMMLV). Si el texto no menciona base presunta mínima, use 'no_aplica'.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.base_presunta_minima.cuantas_smmlv
    nombre: ¿Cuántas SMMLV?
    columna: DY
    tipo: numero
    unidad: null
    valores_permitidos: null
    criterio: Identifique en el acuerdo municipal el número de salarios mínimos mensuales legales vigentes (SMMLV) que se fija como base presunta mínima para determinar la renta o ingreso gravable del contribuyente; si el texto remite a una tabla, anexo o artículo específico, extraiga allí la cifra exacta en SMMLV.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.base_presunta_minima.equivalente_en_pesos_2
    nombre: Equivalente en Pesos
    columna: DZ
    tipo: numero
    unidad: null
    valores_permitidos: null
    criterio: Identifique en el acuerdo municipal el monto o equivalente en pesos de la base presunta mínima (o el valor en UVT que la determina) y registre ese valor numérico; si la norma remite a la UVT vigente de la DIAN o no fija un monto expreso en pesos, registre 0.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.base_presunta_minima.otra
    nombre: ¿Otra?
    columna: EA
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal establezca una base presunta mínima expresada en una unidad distinta de UVT y SMMLV; marque 'no' si no hay otra.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.base_presunta_minima.cual
    nombre: ¿Cuál?
    columna: EB
    tipo: texto_libre
    unidad: null
    valores_permitidos: null
    criterio: Identificar en el acuerdo municipal el monto de base gravable o ingresos que activa la base presunta mínima y la tarifa mínima expresada en UVT que debe pagar el contribuyente; si el texto distingue sector urbano y rural, aplicar el valor en UVT correspondiente al rango en que se ubica el contribuyente según su declaración privada.
    critica: null
    metodo: null
    estado: borrador
- key: elementos_del_tributo.evidencia_de_la_disminucion_de_la_base_gravable
  nombre: Evidencia de la Disminución de la Base Gravable
  hoja: Elementos del tributo
  columnas:
    art: ED
    pag: EE
    cita: EF
    presencia: EG
  palabras_clave:
  - evidencia
  - disminucion
  - base
  - gravable
  - conservar
  - documentos
  - exhibir
  - fundamenten
  - soportes
  - sustentada
  - desconocimiento
  - detraccion
  presencia_key: elementos_del_tributo.evidencia_de_la_disminucion_de_la_base_gravable.presencia_ausencia
  criterio_presencia: Se asigna 'si' cuando el acuerdo municipal exige que toda detracción o disminución de la base gravable del ICA esté sustentada en documentos y soportes contables que el contribuyente debe conservar y exhibir ante la autoridad tributaria, so pena de desconocimiento de dichos valores y sanciones. Se asigna 'no' cuando el texto no impone ni regula dicha exigencia de evidencia, y 'no_aplica' cuando el acuerdo no contempla detracciones o disminuciones de la base gravable.
  campos: []
- key: elementos_del_tributo.actividades_ocasionales
  nombre: Actividades Ocasionales
  hoja: Elementos del tributo
  columnas:
    art: EI
    pag: EJ
    cita: EK
    presencia: EL
  palabras_clave:
  - actividades
  - ocasionales
  - defecto
  - pasar
  - duracion
  - informar
  - mecanismo
  - pague
  - previamente
  - transitoria
  - adicione
  - causados
  presencia_key: elementos_del_tributo.actividades_ocasionales.presencia_ausencia
  criterio_presencia: Marque 'si' cuando el acuerdo municipal defina, regule o mencione expresamente las actividades ocasionales o transitorias gravadas con ICA (incluyendo su período gravable, causación, declaración y pago); marque 'no' si el texto aborda el ICA pero no contempla ni alude a actividades ocasionales; y 'no_aplica' si el acuerdo no regula la materia del impuesto de industria y comercio.
  campos: []
- key: elementos_del_tributo.anticipo
  nombre: Anticipo
  hoja: Elementos del tributo
  columnas:
    art: EN
    pag: EO
    cita: EP
    presencia: EQ
  palabras_clave:
  - anticipo
  - cuarenta
  - adelante
  - liquidado
  - tercer
  - veinte
  - descontable
  - plazos
  - cancelarse
  - quince
  - titulo
  - establecidos
  presencia_key: elementos_del_tributo.anticipo.presencia_ausencia
  criterio_presencia: Marque 'si' cuando el acuerdo municipal establezca expresamente un anticipo del impuesto de industria y comercio a cargo del contribuyente, indicando su porcentaje o forma de liquidación y su carácter descontable del impuesto del año o periodo gravable siguiente. Marque 'no' cuando el texto no contemple anticipo alguno y 'no_aplica' cuando la disposición no regule este aspecto.
  campos:
