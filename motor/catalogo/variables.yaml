    criterio: Se asigna 'si' cuando el acuerdo municipal establece expresamente que el período gravable del impuesto de Industria y Comercio es bimestral; se asigna 'no' cuando define el período gravable como anual o como el año calendario (1 de enero a 31 de diciembre), y 'no_aplica' cuando el texto no menciona ni define el período gravable del impuesto.
