    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal establezca que los distribuidores mayoristas de derivados del petróleo y demás combustibles liquidan el ICA tomando como base gravable el margen bruto de comercialización, definido como la diferencia entre el precio de compra al productor o importador y el precio de venta al público o al distribuidor minorista; marque 'no' si el texto no contempla dicha base especial para el distribuidor mayorista y 'no_aplica' si la disposición no regula la base gravable de combustibles.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.base_gravable_especial.margen_bruto_de_comercializacion_de_los_combustibles_distribuidor_minorista
    nombre: "Margen Bruto de Comercialización \nde los combustibles. Distribuidor \nMinorista"
    columna: DF
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal establezca que los distribuidores minoristas de combustibles liquidan el impuesto de industria y comercio tomando como base gravable el margen bruto de comercialización, entendido como la diferencia entre el precio de compra al distribuidor mayorista o intermediario y el precio de venta al público, descontando sobretasas y demás gravámenes adicionales; en caso contrario, marque 'no' o 'no_aplica' según corresponda.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.base_gravable_especial.distribucion_de_ingresos_transporte_terrestre_entre_empresa_y_propietario
    nombre: "Distribución de Ingresos Transporte\n Terrestre entre Empresa y Propietario"
