    critica: null
    metodo: null
    estado: borrador
- key: elementos_del_tributo.causacion_del_ingreso_para_el_ica
  nombre: Causación del Ingreso para el ICA
  hoja: Elementos del tributo
  columnas:
    art: BP
    pag: BQ
    cita: BR
    presencia: BS
  palabras_clave:
  - causacion
  - ingreso
  - para
  - confluyan
  - esenciales
  - causarse
  - comenzara
  - hasta
  - ultimo
  - primer
  - desde
  - iniciacion
  presencia_key: elementos_del_tributo.causacion_del_ingreso_para_el_ica.presencia_ausencia
  criterio_presencia: Asigne 'si' cuando el texto del acuerdo municipal establezca de forma expresa el momento o hecho a partir del cual se causa el Impuesto de Industria y Comercio (por ejemplo, el inicio de la actividad gravada, la confluencia de los elementos esenciales del tributo, la fecha de iniciación de actividades o el último día del año o período gravable). Asigne 'no' si el acuerdo no menciona ni regula la causación del ingreso para el ICA, y 'no_aplica' si la disposición no guarda relación con este impuesto.
  campos:
  - key: elementos_del_tributo.causacion_del_ingreso_para_el_ica.fecha_de_generacion_del_primer_ingreso_gravable
    nombre: "Fecha de Generación del \nPrimer Ingreso Gravable"
    columna: BT
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Asigne 'si' únicamente cuando el texto del acuerdo fije de manera expresa una fecha o momento cierto de generación del primer ingreso gravable del ICA (por ejemplo, la fecha de inicio de actividades o el momento de la compra o adquisición); asigne 'no' cuando la norma se limite a señalar la causación general del impuesto o su período gravable sin precisar dicha fecha, y 'no_aplica' cuando el acuerdo no trate el tema.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.causacion_del_ingreso_para_el_ica.faccion_del_ano_inicio_fin
    nombre: 'Facción del Año: Inicio - Fin'
    columna: BU
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el texto del acuerdo municipal indique expresamente que el ICA se causa desde la fecha de inicio de la actividad gravada o desde el inicio del período gravable; marque 'no' cuando la cita se refiera a otros aspectos de la causación (elementos esenciales del tributo, reteica, causación al final del año) sin señalar el inicio como hecho generador, y 'no_aplica' si el acuerdo no aborda la causación del ingreso.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.causacion_del_ingreso_para_el_ica.realizacion_del_ingreso_art_28_et
    nombre: Realización del Ingreso Art. 28 ET
    columna: BV
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Asigna 'si' únicamente si el acuerdo municipal remite expresamente al artículo 28 del Estatuto Tributario o adopta la realización del ingreso como base para determinar la causación del ICA; asigna 'no' si la causación se regula con otros criterios (inicio de actividad, elementos esenciales del gravamen, período gravable, compra o adquisición del bien o servicio) sin mencionar dicha norma; asigna 'no_aplica' si el texto no aborda la causación del ingreso.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.causacion_del_ingreso_para_el_ica.otros
    nombre: Otros
    columna: BW
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal fije un momento de causación distinto de los enumerados en los demás campos del bloque; marque 'no' si no hay otro.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.causacion_del_ingreso_para_el_ica.cuales
    nombre: ¿Cuáles?
    columna: BX
    tipo: texto_libre
    unidad: null
    valores_permitidos: null
    criterio: Identifique en el texto del acuerdo municipal el hecho o momento a partir del cual se entiende causado el Impuesto de Industria y Comercio (por ejemplo, el inicio de la actividad gravada), verificando que se mencionen los elementos esenciales del gravamen, y transcriba ese hecho generador como valor del campo.
    critica: null
    metodo: null
    estado: borrador
- key: elementos_del_tributo.causacion_de_los_servicios_publicos_domiciliarios_para_el_ica
