  criterio_presencia: Marque 'si' cuando el acuerdo municipal establezca que el impuesto de industria y comercio por la prestación de servicios públicos domiciliarios se causa en el municipio donde se presta el servicio al usuario final sobre el valor promedio mensual facturado, o incluya reglas de causación para generación, transmisión/conexión de energía, transporte de gas o compraventa de energía; marque 'no' si el texto no contempla dicha causación y 'no_aplica' si el acuerdo no regula la materia.
  campos:
  - key: elementos_del_tributo.causacion_de_los_servicios_publicos_domiciliarios_para_el_ica.generacion_de_energia_ley_56_de_1981
