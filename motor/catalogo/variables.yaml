  - key: elementos_del_tributo.base_gravable_especial.margen_bruto_de_comercializacion_de_los_combustibles_distribuidor_mayorista
    nombre: "Margen Bruto de Comercialización \nde los combustibles. Distribuidor \nMayorista"
