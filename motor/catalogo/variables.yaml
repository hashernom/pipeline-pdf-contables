    - no_aplica
    criterio: Seleccione 'si' si el acuerdo municipal incluye expresamente la venta de medios de pago como un supuesto de base gravable especial del ICA; seleccione 'no' si el texto no la contempla entre las bases gravables especiales; y 'no_aplica' si el acuerdo no regula bases gravables especiales o no menciona el tema.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.base_gravable_especial.patrimonios_autonomos
    nombre: Patrimonios Autónomos
