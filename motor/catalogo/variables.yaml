    nombre: Tarifa Porcentual
    columna: ER
    tipo: texto_libre
    unidad: null
    valores_permitidos: null
    criterio: Identificar en el texto del acuerdo municipal el porcentaje o tarifa fijada para el anticipo del impuesto de Industria y Comercio (por ejemplo, 'veinte por ciento (20%)', 'cuarenta por ciento (40%)' o 'tres por mil (3 x 1000)') y extraer únicamente la cifra numérica que representa dicho porcentaje o tarifa.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.anticipo.sobre_que_base
    nombre: Sobre que base
    columna: ES
    tipo: texto_libre
    unidad: null
    valores_permitidos: null
    criterio: Identifique en el texto del acuerdo municipal la base gravable o el monto sobre el cual se calcula el anticipo (por ejemplo, ingresos brutos, ingresos netos, ventas o el impuesto del periodo anterior) y transcriba esa base tal como la define la norma.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.anticipo.otra
    nombre: ¿Otra?
    columna: ET
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal establezca una modalidad de anticipo distinta de la descrita en los demás campos del bloque; marque 'no' si no hay otra.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.anticipo.cual
    nombre: ¿Cuál?
    columna: EU
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal establezca expresamente un anticipo del ICA; marque 'no' si no lo establece.
    critica: null
    metodo: null
    estado: borrador
- key: actividades_no_sujetas.actividades_no_sujetas
  nombre: Actividades No Sujetas
  hoja: Actividades No Sujetas
  columnas:
    art: G
    pag: H
    cita: I
    presencia: J
  palabras_clave:
  - actividades
  - sujetas
  - incluyan
  - contraidas
  - fabricas
  - horizontal
  - internacionales
  - prohibicion
  - tratados
  - virtud
  - futuro
  - propias
  presencia_key: actividades_no_sujetas.actividades_no_sujetas.presencia_ausencia
  criterio_presencia: Marque 'si' cuando el acuerdo municipal enumere o describa expresamente actividades, ingresos o sujetos que no están gravados con el impuesto de industria y comercio (por ejemplo, producción primaria, exportaciones, establecimientos educativos, entidades sin ánimo de lucro, hospitales, minería con regalías, entre otras); marque 'no' si el texto no contempla ninguna exclusión o prohibición de gravamen, y 'no_aplica' si el acuerdo no regula la materia o no resulta pertinente para el análisis.
  campos:
  - key: actividades_no_sujetas.actividades_no_sujetas.produccion_primaria_agricola_ganadera_y_avicola_sin_proceso_industrial
    nombre: Producción Primaria Agrícola, Ganadera y Avícola; sin Proceso Industrial
    columna: K
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal establezca expresamente que la producción primaria agrícola, ganadera y avícola no está sujeta al impuesto de industria y comercio, siempre que no incluya fábricas de productos alimenticios ni industrias con proceso de transformación, por elemental que sea. Marque 'no' cuando el texto no contemple esta exclusión o sujete dicha actividad al gravamen, y 'no_aplica' si el acuerdo no regula la materia.
    critica: null
    metodo: null
    estado: borrador
  - key: actividades_no_sujetas.actividades_no_sujetas.establecimientos_educativos_publicos
    nombre: Establecimientos Educativos Públicos
    columna: L
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Se marca 'si' cuando el acuerdo municipal establece expresamente que las actividades realizadas por establecimientos educativos públicos (de propiedad de la Nación, el departamento o el municipio) no son sujetas o no están gravadas con el impuesto de industria y comercio; se marca 'no' cuando el texto no contempla dicha exclusión o la condiciona a que no realicen actividades distintas de su objeto, y 'no_aplica' si el acuerdo no regula la materia.
    critica: null
    metodo: null
    estado: borrador
  - key: actividades_no_sujetas.actividades_no_sujetas.actividades_de_beneficencia
    nombre: Actividades de Beneficencia
    columna: M
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal incluya expresamente a las entidades de beneficencia entre las actividades no sujetas o no gravadas con el impuesto de industria y comercio; marque 'no' cuando el texto trate de actividades gravadas o no contemple esta exclusión, y 'no_aplica' si el acuerdo no regula la materia de actividades no sujetas.
    critica: null
    metodo: null
    estado: borrador
  - key: actividades_no_sujetas.actividades_no_sujetas.entidades_culturales
    nombre: Entidades Culturales
    columna: N
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Se marca 'si' cuando el acuerdo municipal establece expresamente que las entidades culturales (sin ánimo de lucro) no son sujetas del impuesto de industria y comercio por las actividades propias de su objeto; se marca 'no' cuando el texto no las exonera o las sujeta al gravamen; y 'no_aplica' cuando el acuerdo no regula la materia.
    critica: null
    metodo: null
    estado: borrador
  - key: actividades_no_sujetas.actividades_no_sujetas.entidades_deportivas
    nombre: Entidades Deportivas
    columna: O
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
