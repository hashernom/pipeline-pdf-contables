    columna: CQ
    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal fundamente la base gravable en una norma distinta de la Ley 14 de 1983 y la Ley 1819 de 2016; marque 'no' si no hay otra.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.base_gravable.cuales
    nombre: ¿Cuáles?
