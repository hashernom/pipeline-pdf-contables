    - no_aplica
    criterio: Marque 'si' si el acuerdo municipal fundamenta o desarrolla la base gravable del ICA citando expresamente la Ley 14 de 1983 (por ejemplo, su artículo 33) o su concordancia con el Decreto 1333 de 1986; marque 'no' si define la base gravable sin referirse a dicha ley.
