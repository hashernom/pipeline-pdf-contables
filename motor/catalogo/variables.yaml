    tipo: si_no
    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Seleccione 'si' cuando el acuerdo municipal incluya, dentro de las bases gravables especiales del impuesto de industria y comercio, una regla específica para distribuidores de productos gravados con el impuesto al consumo cedido a los departamentos; en caso contrario, seleccione 'no'.
    critica: null
    metodo: null
    estado: borrador
  - key: elementos_del_tributo.base_gravable_especial.venta_de_medios_de_pago
