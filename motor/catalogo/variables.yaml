    criterio: Seleccione 'si' únicamente si el acuerdo municipal establece expresamente que el período gravable del impuesto de Industria y Comercio es trimestral; si define el período como anual, bimestral u otra periodicidad distinta, seleccione 'no', y use 'no_aplica' cuando el texto no regule el período gravable.
