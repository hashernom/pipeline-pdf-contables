    unidad: null
    valores_permitidos:
    - si
    - 'no'
    - no_aplica
    criterio: Marque 'si' cuando el acuerdo municipal establezca una base gravable especial distinta de las enumeradas en los demás campos del bloque; marque 'no' si no hay otra.
